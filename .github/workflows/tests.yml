---

name: Tests
on:
  pull_request:

permissions:
  contents: read  # Required to check out the repository

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test test/
